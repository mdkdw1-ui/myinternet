name: Build & Release APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Setup Android NDK r25c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Build hev-socks5-tunnel with ndk-build
        run: |
          # 1. 소스 다운로드 및 압축 해제
          curl -L -o hev.tar.xz https://github.com/heiher/hev-socks5-tunnel/releases/download/2.14.4/hev-socks5-tunnel-2.14.4.tar.xz
          tar -xf hev.tar.xz
          mv hev-socks5-tunnel-2.14.4 hev-src
          cd hev-src
          
          # 2. jni 폴더 생성 및 Android.mk 복사/수정
          mkdir -p jni
          cp Android.mk jni/Android.mk
          
          # 3. Android.mk에 PKGNAME/CLSNAME CFLAGS 추가 (기존 LOCAL_CFLAGS 뒤에 붙임)
          sed -i 's/LOCAL_CFLAGS :=/LOCAL_CFLAGS := -DPKGNAME=com\/mdkdw1\/myinternet -DCLSNAME=HevTunnelManager/' jni/Android.mk
          
          # 4. ndk-build 실행
          NDK_PATH=$ANDROID_NDK_LATEST_HOME
          if [ -z "$NDK_PATH" ]; then NDK_PATH=$ANDROID_NDK_HOME; fi
          $NDK_PATH/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            APP_ABI=arm64-v8a \
            APP_PLATFORM=android-24 \
            NDK_LIBS_OUT=./libs \
            NDK_OUT=./obj
          
          # 5. 빌드된 .so 파일 복사
          cd ..
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp hev-src/libs/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          ls -la app/src/main/jniLibs/arm64-v8a/
      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace \
            -PversionName=${{ steps.bump.outputs.new_name }} \
            -PversionCode=${{ steps.bump.outputs.new_code }}

      - name: Verify APK exists
        run: |
          find app/build/outputs -name "*.apk" -ls
          test -f app/build/outputs/apk/debug/app-debug.apk || (echo "❌ APK 없음"; exit 1)
          echo "✅ APK 확인됨"

      - name: Create Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.new_name }}
          name: MyInternet v${{ steps.bump.outputs.new_name }}
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
