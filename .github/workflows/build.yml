name: Build & Release APK
on:
  push:
    branches: [ main, hev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Setup Android NDK r25c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Force clean build
        run: |
          rm -rf ~/.gradle
          rm -rf .gradle
          rm -rf app/build
          echo "강제 클린 완료"

      - name: Build hev-socks5-tunnel
        run: |
          curl -L -o hev.tar.xz https://github.com/heiher/hev-socks5-tunnel/releases/download/2.14.4/hev-socks5-tunnel-2.14.4.tar.xz
          tar -xf hev.tar.xz
          mv hev-socks5-tunnel-2.14.4 hev-src
          cd hev-src
          sed -i 's/LOCAL_CFLAGS :=/LOCAL_CFLAGS := -DPKGNAME=com\/mdkdw1\/myinternet -DCLSNAME=HevTunnelManager/' Android.mk
          $ANDROID_NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Android.mk \
            APP_ABI=arm64-v8a \
            APP_PLATFORM=android-24 \
            APP_ALLOW_MISSING_DEPS=true \
            NDK_LIBS_OUT=./libs \
            NDK_OUT=./obj
          cd ..
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp hev-src/libs/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          echo "=== jniLibs ==="
          ls -la app/src/main/jniLibs/arm64-v8a/
          test -f app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so || (echo "❌ .so 없음"; exit 1)
          echo "✅ .so 확인됨"

      - name: Bump version from latest tag
        id: bump
        run: |
          git fetch --tags
          LAST=$(git tag -l 'v*' | sort -V | tail -1 | sed 's/^v//')
          LAST=${LAST:-0.000}
          NEW_NAME=$(python3 -c "print(f'{${LAST} + 0.001:.3f}')")
          NEW_CODE=$(( $(git rev-list --count HEAD) ))
          echo "new_name=$NEW_NAME" >> $GITHUB_OUTPUT
          echo "new_code=$NEW_CODE" >> $GITHUB_OUTPUT

      - name: Build Debug APK
        run: |
          gradle clean assembleDebug --no-daemon --stacktrace \
            -PversionName=${{ steps.bump.outputs.new_name }} \
            -PversionCode=${{ steps.bump.outputs.new_code }}

      - name: Verify APK exists & HEV .so inside
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          find app/build/outputs -name "*.apk" -ls
          test -f "$APK" || (echo "❌ APK 없음"; exit 1)
          echo "=== APK 안의 libhev-socks5-tunnel.so ==="
          unzip -l "$APK" | grep -E "libhev-socks5-tunnel.so" || (echo "❌ APK에 so 없음"; exit 1)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: myinternet-hev-${{ steps.bump.outputs.new_name }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90

      - name: Create Release with gh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.bump.outputs.new_name }}-hev"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "MyInternet HEV $TAG" --generate-notes
          gh release upload "$TAG" app/build/outputs/apk/debug/*.apk --clobber
