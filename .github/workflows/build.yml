name: Build & Release APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Bump version (0.001)
        id: bump
        run: |
          source version.properties
          NEW_NAME=$(python3 -c "print(f'{${VERSION_NAME} + 0.001:.3f}')")
          NEW_CODE=$((VERSION_CODE + 1))
          echo "VERSION_NAME=$NEW_NAME" > version.properties
          echo "VERSION_CODE=$NEW_CODE" >> version.properties
          echo "new_name=$NEW_NAME" >> $GITHUB_OUTPUT
          echo "new_code=$NEW_CODE" >> $GITHUB_OUTPUT

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug \
            -PversionName=${{ steps.bump.outputs.new_name }} \
            -PversionCode=${{ steps.bump.outputs.new_code }}

      - name: Create Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.new_name }}
          name: Release v${{ steps.bump.outputs.new_name }}
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit version bump [skip ci]
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add version.properties
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_name }} [skip ci]"
          git push
