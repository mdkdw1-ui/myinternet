name: Build & Release APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:   # 수동 실행 버튼도 추가

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Bump version from latest tag
        id: bump
        run: |
          git fetch --tags
          LAST=$(git tag -l 'v*' | sort -V | tail -1 | sed 's/^v//')
          LAST=${LAST:-0.000}
          NEW_NAME=$(python3 -c "print(f'{${LAST} + 0.001:.3f}')")
          NEW_CODE=$(( $(git rev-list --count HEAD) ))
          echo "new_name=$NEW_NAME" >> $GITHUB_OUTPUT
          echo "new_code=$NEW_CODE" >> $GITHUB_OUTPUT

      - name: Build hev-socks5-tunnel from source (NDK)
        run: |
          # 1. 소스 다운로드 및 압축 해제
          curl -L -o hev.tar.xz https://github.com/heiher/hev-socks5-tunnel/releases/download/2.14.4/hev-socks5-tunnel-2.14.4.tar.xz
          tar -xf hev.tar.xz
          mv hev-socks5-tunnel-2.14.4 hev-src
          
          # 2. CMake를 이용한 안드로이드 크로스 컴파일
          # (GitHub Actions의 ubuntu-latest 러너에는 Android NDK가 미리 설치되어 있습니다)
          cd hev-src
          mkdir build && cd build
          
          # arm64-v8a 빌드 (최신 폰 대부분 지원)
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          
          # 3. 빌드된 .so 파일을 프로젝트에 복사
          cd ../..
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp hev-src/build/libhev-socks5-tunnel.so app/src/main/jniLibs/arm64-v8a/ || true
          # 만약 실행 파일 형태라면 (tun2socks)
          cp hev-src/build/hev-socks5-tunnel app/src/main/jniLibs/arm64-v8a/ || true
          ls -la app/src/main/jniLibs/arm64-v8a/
      - name: Build Debug APK
        run: |
            gradle assembleDebug --no-daemon --stacktrace \
              -PversionName=${{ steps.bump.outputs.new_name }} \
              -PversionCode=${{ steps.bump.outputs.new_code }}

      - name: Verify APK exists
        run: |
          echo "=== APK 목록 ==="
          find app/build/outputs -name "*.apk" -ls
          test -f app/build/outputs/apk/debug/app-debug.apk || (echo "❌ APK 없음"; exit 1)
          echo "✅ APK 확인됨"

      - name: Upload artifact (백업 경로)
        uses: actions/upload-artifact@v4
        with:
          name: myinternet-v${{ steps.bump.outputs.new_name }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90


      - name: Create Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.new_name }}
          name: MyInternet v${{ steps.bump.outputs.new_name }}
          body: |
            자동 빌드: ${{ github.sha }}
            커밋: ${{ github.event.head_commit.message }}
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
