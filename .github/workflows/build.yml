name: Build & Release APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:   # 수동 실행 버튼도 추가

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Bump version (0.001)
        id: bump
        run: |
          source version.properties
          NEW_NAME=$(python3 -c "print(f'{${VERSION_NAME} + 0.001:.3f}')")
          NEW_CODE=$((VERSION_CODE + 1))
          echo "VERSION_NAME=$NEW_NAME" > version.properties
          echo "VERSION_CODE=$NEW_CODE" >> version.properties
          echo "new_name=$NEW_NAME" >> $GITHUB_OUTPUT
          echo "new_code=$NEW_CODE" >> $GITHUB_OUTPUT

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: |
          echo "=== APK 목록 ==="
          find app/build/outputs -name "*.apk" -ls
          test -f app/build/outputs/apk/debug/app-debug.apk || (echo "❌ APK 없음"; exit 1)
          echo "✅ APK 확인됨"

      - name: Upload artifact (백업 경로)
        uses: actions/upload-artifact@v4
        with:
          name: myinternet-v${{ steps.bump.outputs.new_name }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90

      - name: Create Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.new_name }}
          name: MyInternet v${{ steps.bump.outputs.new_name }}
          body: |
            자동 빌드: ${{ github.sha }}
            커밋: ${{ github.event.head_commit.message }}
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
          fail_on_unmatched_files: true   # 파일 매칭 실패 시 워크플로우 실패
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit version bump [skip ci]
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add version.properties
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_name }} [skip ci]"
          git push
