name: Build & Release APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9


      - name: Force clean build
        run: |
          rm -rf ~/.gradle
          rm -rf .gradle
          rm -rf app/build
          echo "================="
          echo "강제 클린 완료"
          echo "================="

      - name: Bump version from latest tag
        id: bump
        run: |
          git fetch --tags
          LAST=$(git tag -l 'v*' | sort -V | tail -1 | sed 's/^v//')
          LAST=${LAST:-0.000}
          NEW_NAME=$(python3 -c "print(f'{${LAST} + 0.001:.3f}')")
          NEW_CODE=$(( $(git rev-list --count HEAD) ))
          echo "new_name=$NEW_NAME" >> $GITHUB_OUTPUT
          echo "new_code=$NEW_CODE" >> $GITHUB_OUTPUT

      - name: Build Debug APK
        run: |
          gradle clean assembleDebug --no-daemon --stacktrace \
            -PversionName=${{ steps.bump.outputs.new_name }} \
            -PversionCode=${{ steps.bump.outputs.new_code }}

      - name: Verify Tun2Socks in APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "=== APK 내 dex 클래스 검사 ==="
          FOUND_T2S=0
          FOUND_HEV=0
          for f in $(unzip -Z1 "$APK" | grep -E '\.dex$'); do
            echo "--- $f ---"
            OUT=$(unzip -p "$APK" "$f" | strings | grep -E "Tun2Socks|HevTunnelManager|TProxyService|hev/htproxy" || true)
            echo "$OUT"
            if echo "$OUT" | grep -q "Tun2Socks"; then FOUND_T2S=1; fi
            if echo "$OUT" | grep -qE "HevTunnelManager|TProxyService|hev/htproxy"; then FOUND_HEV=1; fi
          done
          if [ "$FOUND_T2S" = "0" ]; then
            echo "❌ Tun2Socks 클래스가 APK에 없음"; exit 1
          fi
          if [ "$FOUND_HEV" = "1" ]; then
            echo "❌ hev 클래스가 APK에 남아있음"; exit 1
          fi
          echo "✅ Tun2Socks 포함, hev 없음 확인"
      - name: Verify APK exists
        run: |
          find app/build/outputs -name "*.apk" -ls
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: myinternet-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90

      - name: Create Release with gh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.bump.outputs.new_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "MyInternet $TAG" --generate-notes
          gh release upload "$TAG" app/build/outputs/apk/debug/*.apk --clobber
