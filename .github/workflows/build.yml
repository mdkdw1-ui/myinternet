name: Build & Release APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:   # 수동 실행 버튼도 추가

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Bump version from latest tag
        id: bump
        run: |
          git fetch --tags
          LAST=$(git tag -l 'v*' | sort -V | tail -1 | sed 's/^v//')
          LAST=${LAST:-0.000}
          NEW_NAME=$(python3 -c "print(f'{${LAST} + 0.001:.3f}')")
          NEW_CODE=$(( $(git rev-list --count HEAD) ))
          echo "new_name=$NEW_NAME" >> $GITHUB_OUTPUT
          echo "new_code=$NEW_CODE" >> $GITHUB_OUTPUT

      - name: Download hev-socks5-tunnel binary to assets
        run: |
          mkdir -p app/src/main/assets
          # GitHub Release에서 리눅스 ARM64 바이너리 다운로드
          curl -L -o app/src/main/assets/hev-socks5-tunnel \
            https://github.com/heiher/hev-socks5-tunnel/releases/download/2.14.4/hev-socks5-tunnel-linux-arm64
          
          # 다운로드된 파일 확인 (크기가 100KB 이상인지)
          ls -la app/src/main/assets/
          file app/src/main/assets/hev-socks5-tunnel
          
          # 실행 권한 부여 (APK에 포함될 때 권한은 무시되지만, 빌드 확인용)
          chmod +x app/src/main/assets/hev-socks5-tunnel
      - name: Build Debug APK
        run: |
            gradle assembleDebug --no-daemon --stacktrace \
              -PversionName=${{ steps.bump.outputs.new_name }} \
              -PversionCode=${{ steps.bump.outputs.new_code }}

      - name: Verify APK exists
        run: |
          echo "=== APK 목록 ==="
          find app/build/outputs -name "*.apk" -ls
          test -f app/build/outputs/apk/debug/app-debug.apk || (echo "❌ APK 없음"; exit 1)
          echo "✅ APK 확인됨"

      - name: Upload artifact (백업 경로)
        uses: actions/upload-artifact@v4
        with:
          name: myinternet-v${{ steps.bump.outputs.new_name }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90


      - name: Create Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.new_name }}
          name: MyInternet v${{ steps.bump.outputs.new_name }}
          body: |
            자동 빌드: ${{ github.sha }}
            커밋: ${{ github.event.head_commit.message }}
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
